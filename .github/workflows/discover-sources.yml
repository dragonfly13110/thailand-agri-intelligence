name: Probe Thai catalogs
on:
  schedule:
    - cron: '23 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-probe
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: DOAE catalog metadata
        run: python -m tadih discover --source doae --limit 100 --max-pages 2 > doae-status.json
      - name: OAE catalog metadata
        if: always()
        run: python -m tadih discover --source oae --limit 100 --max-pages 2 > oae-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tadih-catalog-probes
          path: |
            doae-status.json
            oae-status.json
          retention-days: 14
