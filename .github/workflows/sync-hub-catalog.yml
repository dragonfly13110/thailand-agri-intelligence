name: Sync Hub source catalogs

# Daily metadata sync: source catalogs -> Cloudflare D1 (or PostgreSQL).
# Secrets consumed (exact setup commands: docs/operations/ci-secrets-2026-10-30.md):
#   CF_D1_TOKEN, CF_ACCOUNT_ID, CF_D1_DATABASE_ID  D1 sink; the token is mandatory
#   TADIH_SYNC_DATABASE_URL                        PostgreSQL sink, used when the token is empty
# With none of them set the first step fails with a message naming them, instead
# of finishing green without writing anything.

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with numeric writer jobs; preserve queued syncs instead of replacing them.
  group: hub-d1-writes
  queue: max

jobs:
  # A manual dispatch on a feature branch would otherwise skip `sync` and finish
  # green without writing anything. Fail loudly instead of reporting a silent no-op.
  refuse-non-main:
    name: Refuse to write from a non-main ref
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Explain why this run is red
        run: |
          echo "::error::This workflow writes to the shared warehouse and only runs from refs/heads/main; this run is on ${{ github.ref }}. Re-dispatch it on main."
          exit 1

  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check whether the sync database is configured
        id: config
        shell: bash
        env:
          CF_ACCOUNT_ID_SET: ${{ secrets.CF_ACCOUNT_ID != '' }}
          CF_D1_DATABASE_ID_SET: ${{ secrets.CF_D1_DATABASE_ID != '' }}
          CF_D1_TOKEN_SET: ${{ secrets.CF_D1_TOKEN != '' }}
          TADIH_SYNC_DATABASE_URL_SET: ${{ secrets.TADIH_SYNC_DATABASE_URL != '' }}
        run: |
          if [[ "$CF_D1_TOKEN_SET" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "sink=d1" >> "$GITHUB_OUTPUT"
            if [[ "$CF_ACCOUNT_ID_SET" != "true" || "$CF_D1_DATABASE_ID_SET" != "true" ]]; then
              echo "::warning::CF_ACCOUNT_ID / CF_D1_DATABASE_ID are not configured as repository secrets; the D1 client falls back to the defaults compiled into src/tadih/hub_catalog_sync.py. Set all three D1 secrets (see docs/operations/ci-secrets-2026-10-30.md)."
            fi
          elif [[ "$TADIH_SYNC_DATABASE_URL_SET" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "sink=postgresql" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::No sync database is configured: repository secrets CF_D1_TOKEN and TADIH_SYNC_DATABASE_URL are both empty, so the catalog sync would have nowhere to write. Set either CF_D1_TOKEN (+ CF_ACCOUNT_ID, CF_D1_DATABASE_ID) or TADIH_SYNC_DATABASE_URL; exact commands are in docs/operations/ci-secrets-2026-10-30.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: |
          python -m pip install -r requirements.lock
          if [[ "${{ steps.config.outputs.sink }}" == "postgresql" ]]; then
            python -m pip install -e ".[hub]"
          else
            python -m pip install -e "."
          fi

      - name: Sync source catalogs
        if: steps.config.outputs.enabled == 'true'
        env:
          CF_ACCOUNT_ID: ${{ steps.config.outputs.sink == 'd1' && secrets.CF_ACCOUNT_ID || '' }}
          CF_D1_DATABASE_ID: ${{ steps.config.outputs.sink == 'd1' && secrets.CF_D1_DATABASE_ID || '' }}
          CF_D1_TOKEN: ${{ steps.config.outputs.sink == 'd1' && secrets.CF_D1_TOKEN || '' }}
          TADIH_SYNC_DATABASE_URL: ${{ steps.config.outputs.sink == 'postgresql' && secrets.TADIH_SYNC_DATABASE_URL || '' }}
        run: python scripts/sync_hub_catalog.py --sink ${{ steps.config.outputs.sink }}
