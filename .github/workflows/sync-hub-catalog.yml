name: Sync Hub source catalogs

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with numeric writer jobs; preserve queued syncs instead of replacing them.
  group: hub-d1-writes
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check whether the sync database is configured
        id: config
        shell: bash
        env:
          CF_D1_TOKEN_SET: ${{ secrets.CF_D1_TOKEN != '' }}
          TADIH_SYNC_DATABASE_URL_SET: ${{ secrets.TADIH_SYNC_DATABASE_URL != '' }}
        run: |
          if [[ "$CF_D1_TOKEN_SET" == "true" || "$TADIH_SYNC_DATABASE_URL_SET" == "true" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            if [[ "$CF_D1_TOKEN_SET" == "true" ]]; then
              echo "sink=d1" >> "$GITHUB_OUTPUT"
            else
              echo "sink=postgresql" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Neither CF_D1_TOKEN nor TADIH_SYNC_DATABASE_URL is configured; catalog sync cannot run."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: |
          if [[ "${{ steps.config.outputs.sink }}" == "postgresql" ]]; then
            python -m pip install -e ".[hub]"
          else
            python -m pip install -e "."
          fi

      - name: Sync source catalogs
        if: steps.config.outputs.enabled == 'true'
        env:
          CF_ACCOUNT_ID: ${{ steps.config.outputs.sink == 'd1' && secrets.CF_ACCOUNT_ID || '' }}
          CF_D1_DATABASE_ID: ${{ steps.config.outputs.sink == 'd1' && secrets.CF_D1_DATABASE_ID || '' }}
          CF_D1_TOKEN: ${{ steps.config.outputs.sink == 'd1' && secrets.CF_D1_TOKEN || '' }}
          TADIH_SYNC_DATABASE_URL: ${{ steps.config.outputs.sink == 'postgresql' && secrets.TADIH_SYNC_DATABASE_URL || '' }}
        run: python scripts/sync_hub_catalog.py --sink ${{ steps.config.outputs.sink }}
