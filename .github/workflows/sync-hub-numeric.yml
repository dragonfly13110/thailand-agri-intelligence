        run: |
          echo "::error::The Open-Meteo numeric sync failed with exit code ${{ steps.sync.outputs.exit_code }}."
          exit 1
      - name: Record the Open-Meteo result in the run summary
        if: always()
        env:
          SOURCE: open_meteo
          SCRIPT: scripts/sync_open_meteo_to_d1.py
          STATUS: ${{ steps.sync.outputs.status }}
          EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
