    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
      TMD_API_UID: ${{ secrets.TMD_API_UID }}
      TMD_API_UKEY: ${{ secrets.TMD_API_UKEY }}
    steps:
      - name: Check the Cloudflare D1 credentials
        shell: bash
        run: |
          if [[ -z "${CF_D1_TOKEN:-}" ]]; then
            echo "::error::Repository secret CF_D1_TOKEN is not configured; the TMD numeric sync cannot publish to D1."
            exit 1
          fi
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_D1_DATABASE_ID:-}" ]]; then
            echo "::warning::CF_ACCOUNT_ID / CF_D1_DATABASE_ID are not configured as repository secrets; the D1 client falls back to the defaults compiled into src/tadih/hub_catalog_sync.py."
          fi
          if [[ -z "${TMD_API_UID:-}" || -z "${TMD_API_UKEY:-}" ]]; then
            echo "::warning::TMD_API_UID / TMD_API_UKEY are not configured as repository secrets; the TMD API call may be rejected upstream."
          fi
