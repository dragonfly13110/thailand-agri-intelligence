  chirps:
    name: Sync CHIRPS numeric observations (existing writer)
    needs: resolve-slot
    if: github.ref == 'refs/heads/main' && needs.resolve-slot.outputs.chirps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_D1_TOKEN: ${{ secrets.CF_D1_TOKEN }}
    steps:
      - name: Check the Cloudflare D1 credentials
        shell: bash
        run: |
          if [[ -z "${CF_D1_TOKEN:-}" ]]; then
            echo "::error::Repository secret CF_D1_TOKEN is not configured; the CHIRPS numeric sync cannot publish to D1."
            exit 1
          fi
          if [[ -z "${CF_ACCOUNT_ID:-}" || -z "${CF_D1_DATABASE_ID:-}" ]]; then
            echo "::warning::CF_ACCOUNT_ID / CF_D1_DATABASE_ID are not configured as repository secrets; the D1 client falls back to the defaults compiled into src/tadih/hub_catalog_sync.py."
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        # read_chirps_observations() imports rasterio fail-closed (documented
        # [geo] extra in pyproject.toml); rasterio is not in requirements.lock.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip install "rasterio>=1.4,<2"
      - name: Sync the CHIRPS numeric observations
        id: sync
        continue-on-error: true
        env:
          SYNC_DATE: ${{ inputs.date }}
          SYNC_SCRIPT: scripts/sync_hub_numeric.py
        run: |
          set -uo pipefail
          if [[ ! -f "${SYNC_SCRIPT}" ]]; then
            echo "::error::${SYNC_SCRIPT} is missing; refusing to report the CHIRPS sync as successful."
            echo "ran=true" >> "$GITHUB_OUTPUT"
            echo "status=failed_script_missing" >> "$GITHUB_OUTPUT"
            echo "exit_code=127" >> "$GITHUB_OUTPUT"
            exit 127
          fi
          if [[ -n "${SYNC_DATE:-}" ]]; then
            echo "::warning::scripts/sync_hub_numeric.py has no --date flag (it publishes the latest reviewed sample); the batch-date input is ignored for chirps."
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          # --write is this writer's documented write flag; --input and --write
          # are mutually exclusive, so the live bounded sample path is used.
          set +e
          PYTHONPATH=src python "${SYNC_SCRIPT}" --write | tee sync-output.json
          code=$?
          set -e
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          if [[ "${code}" -eq 0 ]]; then
            echo "status=succeeded" >> "$GITHUB_OUTPUT"
          else
            echo "status=failed" >> "$GITHUB_OUTPUT"
          fi
          exit "${code}"
      - name: Enforce the CHIRPS sync exit status
        if: always() && steps.sync.outcome == 'failure' && steps.sync.outputs.ran == 'true'
        run: |
          echo "::error::The CHIRPS numeric sync failed with exit code ${{ steps.sync.outputs.exit_code }}."
          exit 1
      - name: Record the CHIRPS result in the run summary
        if: always()
        env:
          SOURCE: chirps
          SCRIPT: scripts/sync_hub_numeric.py
          STATUS: ${{ steps.sync.outputs.status }}
          EXIT_CODE: ${{ steps.sync.outputs.exit_code }}
          BATCH_DATE: ${{ inputs.date }}
        run: |
          python - <<'PY'
