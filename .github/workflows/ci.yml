name: Validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Python pipeline: contracts, adapters and CLI.
  # Tests whose input is a git-ignored local path (data/local/**, probes/**) skip
  # themselves with a reason naming that path; they never fail a fresh checkout
  # and they never report a silent pass.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - name: Build and verify an offline baseline snapshot
        run: |
          python -m tadih build > build-result.json
          python -c "import json, subprocess, sys; p=json.load(open('build-result.json'))['snapshot']; subprocess.run([sys.executable, '-m', 'tadih', 'verify', p], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: tadih-verified-exports
          path: |
            exports/build/
            build-result.json
          retention-days: 14
  # Web dashboard (Next.js on vinext). Node 22 matches web/package.json "engines".
  # typecheck runs first so a type error fails before the slower test and build steps.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck (next typegen + tsc)
        run: npm run typecheck
      - name: Unit tests (node --test on tests/*.test.ts)
        run: npm run test
      - name: Build with vinext
        run: npm run build:vinext
