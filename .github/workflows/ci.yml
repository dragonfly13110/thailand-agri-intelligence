name: Validate and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - name: Build and verify an offline baseline snapshot
        run: |
          python -m tadih build > build-result.json
          python -c "import json, subprocess, sys; p=json.load(open('build-result.json'))['snapshot']; subprocess.run([sys.executable, '-m', 'tadih', 'verify', p], check=True)"
      - uses: actions/upload-artifact@v4
        with:
          name: tadih-verified-exports
          path: |
            exports/build/
            build-result.json
          retention-days: 14
